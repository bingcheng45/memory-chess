name: IndexNow

on:
  deployment_status:
  workflow_dispatch:

concurrency:
  group: indexnow
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  submit:
    if: github.event_name == 'workflow_dispatch' || (github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          path: .indexnow/state.json
          key: indexnow-state-${{ github.run_id }}
          restore-keys: indexnow-state-
      - name: Submit URLs whose lastmod is newer than the last submission
        if: github.event_name == 'deployment_status'
        run: node scripts/indexnow-submit.mjs --state .indexnow/state.json
      - name: Submit the whole sitemap
        if: github.event_name == 'workflow_dispatch'
        run: node scripts/indexnow-submit.mjs --state .indexnow/state.json --all
