<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Check: IntroFirstScreen markup with the real intro.css</title>
<!-- Renders the markup IntroFirstScreen.tsx serves, styled only by the real src/components/home/intro/intro.css, to
     check the CSS without running the site. The header bar stands in for the Lab Paper header. -->
<link rel="stylesheet" href="../../../src/components/home/intro/intro.css">
<style>
  body { margin: 0; background: #f6f8f7; }
  .lab-paper { --lp-gutter: clamp(16px, 4vw, 48px); }
  .stand-in-header { height: 64px; border-bottom: 1px solid #d6dfe0; background: #fff; }
</style>
</head>
<body>
<div class="lab-paper">
  <div class="stand-in-header"></div>
  <main>
    <section class="home-first" aria-label="Najdorf's 45 boards">
      <p class="home-first-kicker">São Paulo · January 1947</p>
      <figure class="home-first-figure">
        <div class="home-first-boards" id="boards" role="img" aria-label="Fifteen chessboards"></div>
        <figcaption>45 boards, like these</figcaption>
      </figure>
      <h2 class="home-first-title">Najdorf held <em>45 boards</em> in his head. How many can you hold?</h2>
      <p class="home-first-lede">Memory Chess shows you a position for a few seconds, then hides it. Rebuild it and get a score.</p>
      <div class="home-first-actions">
        <a class="home-first-play" href="#">Play a free round</a>
        <button type="button" class="home-first-story">Read Najdorf's story</button>
        <p class="home-first-fine">Free · no account · about a minute</p>
      </div>
    </section>
    <p style="padding:24px;font:16px system-ui">The existing hero follows here.</p>
  </main>
</div>
<script>
  const games = [
    ["r1b1k2r/2pqbppp/p1p5/8/4n3/8/PPPP1PPP/RNBQ1RK1", "e4"], ["r1b5/ppp2kpr/3p4/8/4n3/N1P1P3/Pn6/R3K3", "b2"],
    ["4kb1r/1p4pp/2np4/4p3/1P6/2N1P3/2P3PP/R3K1R1", "g1"], ["rn6/ppp1kp1p/6p1/4P3/8/7P/PPP1RK1P/R7", "e2"],
    ["rn2kbnr/p3pppp/2p5/8/3q3P/6N1/PP3PP1/R1B1KBNR", "d4"], ["rnb3k1/pp3pp1/2p4p/3p4/3P4/1P3P2/P3N1PP/R3KB1R", "e2"],
    ["rn1qkb1r/pp2pppp/2p5/3n1b2/P1pP4/5N2/1P2PPPP/R1BQKB1R", "a4"], ["rn3k2/pp3p1p/6p1/2p2p2/2P5/5N1R/PP3PP1/R2NKB2", "h3"],
    ["rnb2rk1/ppp2ppn/4p3/3q4/3P4/1QP1P3/P4PPP/R1B1K1NR", "b3"], ["rn1qkb1r/pbp2ppp/8/4p3/N7/6P1/PP1PPP1P/R1B1K1NR", "a4"],
    ["r1bqkb1r/pp3ppp/2n1pn2/2pp4/3P1B2/2P1PN2/PP3PPP/RN1QKB1R", "f4"], ["r3k2r/p1p1pp2/2p2p2/8/8/2N5/PP3PPP/R1b1K2R", "c1"],
    ["1r2k2r/p1p3pp/8/2p5/8/P1N1P1P1/1P5P/1b2K2R", "b1"], ["rn3k2/ppp1pp1p/8/6p1/4P3/2P5/P4PBP/R1B1K1NR", "g2"],
    ["r1bqk2r/1pppbppp/p1B2n2/4p3/4P3/5N2/PPPP1PPP/RNBQ1RK1", "c6"],
  ];
  const glyph = { K: "♔", Q: "♕", R: "♖", B: "♗", N: "♘", P: "♙", k: "♚", q: "♛", r: "♜", b: "♝", n: "♞", p: "♟" };
  const svg = ([fen, last]) => {
    const lit = `<rect x="${last.charCodeAt(0) - 97}" y="${8 - Number(last[1])}" width="1" height="1"/>`;
    const pieces = fen.split("/").flatMap((rank, row) => {
      let col = 0;
      return [...rank].map((c) => {
        if (/\d/.test(c)) { col += Number(c); return ""; }
        const white = c === c.toUpperCase() ? " data-white=\"true\"" : "";
        const t = `<text x="${col + 0.5}" y="${row + 0.54}"${white}>${glyph[c]}&#xFE0E;</text>`;
        col += 1;
        return t;
      });
    }).join("");
    return `<svg class="home-first-board" viewBox="0 0 8 8" aria-hidden="true">${lit}${pieces}</svg>`;
  };
  document.getElementById("boards").innerHTML = games.map(svg).join("");
</script>
</body>
</html>
